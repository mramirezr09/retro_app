# RetroApp - VirtualHost para Apache + mod_php
# Instalar en: /etc/apache2/sites-available/retro_app.conf
# Requiere: a2enmod rewrite headers  y  Listen 8083 en ports.conf

<VirtualHost *:8083>
    ServerName retro-app
    ServerAdmin admin@localhost

    DocumentRoot /var/www/retro_app/public

    <Directory /var/www/retro_app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defensa extra: el resto del proyecto nunca debe servirse por web
    <Directory /var/www/retro_app>
        Require all denied
    </Directory>

    # Subidas de Excel (los defaults de Ubuntu son 2M/8M)
    php_value upload_max_filesize 25M
    php_value post_max_size 30M

    # La IA gratuita puede tardar; el endpoint tambien hace set_time_limit(0)
    php_value max_execution_time 0
    php_value max_input_time 600
    php_value memory_limit 256M

    # Entorno para opencode CLI (mod_php). Ajustar si el binario esta en otra ruta.
    SetEnv HOME /var/www
    SetEnv PATH /usr/local/bin:/usr/bin:/bin

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "no-referrer"
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/retro_app_error.log
    CustomLog ${APACHE_LOG_DIR}/retro_app_access.log combined
</VirtualHost>
