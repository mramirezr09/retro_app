# RetroApp - AppArmor para ejecutar opencode desde Apache (mod_php)
#
# Ubuntu confina apache2 con un perfil AppArmor. Bajo mod_php, el proceso de
# Apache debe poder ejecutar el binario de opencode y escribir su HOME.
# Si `sudo -u www-data HOME=/var/www opencode ...` funciona por consola pero
# la app devuelve un error de opencode, el perfil AppArmor esta bloqueando.
#
# Diagnostico:
#   sudo aa-status
#   sudo dmesg | grep -i apparmor | tail -20
#   sudo journalctl -k | grep -i DENIED | tail -20
#
# Opcion A (recomendada): permitir opencode en el perfil local de Apache.
#   1) Copie el contenido de abajo en:
#        /etc/apparmor.d/local/usr.sbin.apache2
#   2) Recargue el perfil:
#        sudo apparmor_parser -r /etc/apparmor.d/usr.sbin.apache2
#
# Opcion B (diagnostico rapido): poner el perfil en modo complain (registra
# en vez de bloquear). No usar como solucion permanente.
#        sudo aa-complain /usr/sbin/apache2
#
# Opcion C: migrar a php-fpm con un perfil AppArmor propio para el pool.
#
# --- Contenido sugerido para /etc/apparmor.d/local/usr.sbin.apache2 ---
#
#   # RetroApp: permitir ejecutar opencode CLI
#   /usr/local/bin/opencode ix,
#   /usr/local/bin/opencode-* ix,
#   /var/www/.local/share/opencode/** rwk,
#   /var/www/.cache/opencode/** rwk,
#   /var/www/.config/opencode/** rwk,
#   /var/www/storage/opencode/** rwk,
#
# Notas:
#  - Ajuste la ruta de opencode si su binario vive en otro lugar
#    (por ejemplo ~/.opencode/bin/opencode).
#  - 'ix' hereda el perfil de Apache (que ya tiene acceso a red); si el binario
#    necesita un perfil propio, use 'px' creando aparte /etc/apparmor.d/opencode.
