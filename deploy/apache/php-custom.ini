; RetroApp - overrides de PHP para Apache (mod_php)
; Copiar en: /etc/php/<version>/apache2/conf.d/99-retro_app.ini

upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 0
max_input_time = 600
memory_limit = 256M

; Asegura que proc_open este disponible para el servicio opencode.
; Si disable_functions incluye proc_open, quitar esa entrada.
